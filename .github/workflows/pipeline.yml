name: pipeline

# Roda o projeto inteiro do zero e garante que os resultados versionados
# sao exatamente os que o SQL produz.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  executar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache da base da UCI
        uses: actions/cache@v4
        with:
          path: data/online_retail_ii.zip
          key: uci-online-retail-ii-v1

      - run: pip install -r requirements.txt

      - name: Dados, SQL, testes, graficos, Excel e dashboard
        run: python executar_projeto.py

      - name: Resultados reproduziveis
        run: git diff --exit-code -- resultados/ docs/dados.js
